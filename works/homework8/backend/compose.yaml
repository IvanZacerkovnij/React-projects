name: homework8

x-connection: &connection
  ConnectionStrings__SqlServerConnection: "Server=db,1433;Database=store;User Id=sa;Password=${SQL_SERVER_PASSWORD:-Homework8_Local!2026};TrustServerCertificate=True;"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SQL_SERVER_PASSWORD:-Homework8_Local!2026}"
    ports:
      - "127.0.0.1:1438:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  migrations:
    build:
      context: .
      target: migrations
    environment: *connection
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      MSSQL_SA_PASSWORD: "${SQL_SERVER_PASSWORD:-Homework8_Local!2026}"
    volumes:
      - ./seed-demo.sql:/seed-demo.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -d store -b -f 65001 -i /seed-demo.sql'
    depends_on:
      migrations:
        condition: service_completed_successfully

  api:
    build:
      context: .
      target: api
    environment:
      <<: *connection
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "127.0.0.1:5097:8080"
    volumes:
      - uploaded_images:/app/wwwroot
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  sqlserver_data:
  uploaded_images:

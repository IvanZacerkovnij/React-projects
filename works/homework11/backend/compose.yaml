name: homework11

x-api: &api
  build:
    context: .
    target: api
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__SqlServerConnection: "Server=db,1433;Database=homework11;User Id=sa;Password=${SQL_SERVER_PASSWORD:-Homework11_Local!2026};TrustServerCertificate=True;"
    Jwt__Key: "${JWT_KEY:-Homework11_Local_Development_Jwt_Key_2026!}"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SQL_SERVER_PASSWORD:-Homework11_Local!2026}"
    ports:
      - "127.0.0.1:1441:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  initialize-database:
    <<: *api
    command: ["--initialize-database"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    ports:
      - "127.0.0.1:5101:8080"
    depends_on:
      initialize-database:
        condition: service_completed_successfully

volumes:
  sqlserver_data:
